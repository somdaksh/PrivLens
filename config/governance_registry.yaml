# PrivLens Data Governance & RoPA Registry
# Declarations of Business Purposes, Retention Schedules, and Data Stewardship
# Calibrated for the 5 Official PS-019 Personal Data Classes

organization: "Enterprise Global Corp"
governance_version: "2026.3"
last_audit_date: "2026-10-15"

# Declared Processing Purposes Library
purposes:
  - purpose_id: "PURP_ORDER_FULFILLMENT"
    name: "Customer Order Fulfillment & Shipping"
    description: "Processing necessary for physical delivery and communication with customers regarding purchases."
    declared_by: "Operations Team"

  - purpose_id: "PURP_PAYMENT_SETTLEMENT"
    name: "Payment Processing & Financial Ledger"
    description: "Processing required for billing, dispute resolution, tax compliance, and anti-fraud checks."
    declared_by: "Finance & Accounting"

  - purpose_id: "PURP_HR_PAYROLL"
    name: "Employee Payroll & Statutory Benefits"
    description: "Maintenance of employment records, tax withholdings, and statutory benefits administration."
    declared_by: "People & Culture (HR)"

  - purpose_id: "PURP_KYC_COMPLIANCE"
    name: "Statutory KYC & Customer Verification"
    description: "Identity verification mandated by financial regulations and anti-money laundering (AML) laws."
    declared_by: "Compliance & Legal"

  - purpose_id: "PURP_SEC_AUDIT"
    name: "Information Security & Access Auditing"
    description: "Tracking authentication events, preventing unauthorized intrusions, and security forensics."
    declared_by: "Information Security Team"

# Field-Level Registrations across Data Sources
registered_fields:
  # Customer Signups CSV
  "customer_signups.csv":
    "customer_name":
      purpose_id: "PURP_ORDER_FULFILLMENT"
      retention_period_months: 36
      retention_trigger: "Account Deletion"
      data_owner: "CRM Engineering"
      status: "ACTIVE"

    "email_address":
      purpose_id: "PURP_ORDER_FULFILLMENT"
      retention_period_months: 36
      retention_trigger: "Account Deletion"
      data_owner: "CRM Engineering"
      status: "ACTIVE"

    "phone_number":
      purpose_id: "PURP_ORDER_FULFILLMENT"
      retention_period_months: 24
      retention_trigger: "Order Completion"
      data_owner: "CRM Engineering"
      status: "ACTIVE"

    "residential_address":
      purpose_id: "PURP_ORDER_FULFILLMENT"
      retention_period_months: null # Missing retention to test flagging
      retention_trigger: null
      data_owner: "Logistics Team"
      status: "INCOMPLETE"

    "pin_code":
      purpose_id: "PURP_ORDER_FULFILLMENT"
      retention_period_months: 36
      retention_trigger: "Account Deletion"
      data_owner: "Logistics Team"
      status: "ACTIVE"

    "gender":
      purpose_id: null # Missing purpose to test flagging
      retention_period_months: 12
      retention_trigger: "Account Review"
      data_owner: "Analytics Team"
      status: "UNLINKED_PURPOSE"

    # date_of_birth is deliberately omitted from registry to test UNREGISTERED_SHADOW_DATA

  # KYC Verification Records CSV
  "kyc_verification_records.csv":
